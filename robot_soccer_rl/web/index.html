<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robot Soccer RL — Live Training Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    gap: 10px;
    min-height: 100%;
  }
  h1 {
    font-size: 1.1rem;
    margin: 4px 0;
    color: var(--muted);
    font-weight: 500;
    text-align: center;
  }
  #stage {
    width: 100%;
    max-width: 960px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    aspect-ratio: 24 / 16;
    display: block;
  }
  .hud {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat .label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat .value {
    font-size: 1.15rem;
    font-weight: 600;
    margin-top: 2px;
  }
  #connStatus {
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .status-live { color: var(--good); }
  .status-down { color: #f85149; }
  #goalFlash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: 800;
    color: var(--good);
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #goalFlash.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Robot Soccer RL — Live Training Viewer</h1>
  <span id="connStatus" class="status-down">connecting…</span>
  <canvas id="stage" width="960" height="640"></canvas>
  <div class="hud">
    <div class="stat"><div class="label">Episode</div><div class="value" id="statEpisode">0</div></div>
    <div class="stat"><div class="label">Step</div><div class="value" id="statStep">0</div></div>
    <div class="stat"><div class="label">Episode Reward</div><div class="value" id="statReward">0.00</div></div>
    <div class="stat"><div class="label">Timesteps Trained</div><div class="value" id="statTimesteps">0</div></div>
  </div>
</div>
<div id="goalFlash">GOAL!</div>

<script>
(function () {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const connStatus = document.getElementById("connStatus");
  const goalFlash = document.getElementById("goalFlash");
  const statEpisode = document.getElementById("statEpisode");
  const statStep = document.getElementById("statStep");
  const statReward = document.getElementById("statReward");
  const statTimesteps = document.getElementById("statTimesteps");

  const img = new Image();
  let socket = null;
  let reconnectDelay = 1000;
  const MAX_RECONNECT_DELAY = 10000;

  function setStatus(connected) {
    connStatus.textContent = connected ? "live" : "disconnected — retrying…";
    connStatus.className = connected ? "status-live" : "status-down";
  }

  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${location.host}/ws`;
  }

  function connect() {
    socket = new WebSocket(wsUrl());

    socket.onopen = () => {
      setStatus(true);
      reconnectDelay = 1000;
    };

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type !== "frame") return;

      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = "data:image/jpeg;base64," + msg.data;

      statEpisode.textContent = msg.episode;
      statStep.textContent = msg.step;
      statReward.textContent = Number(msg.episode_reward).toFixed(2);
      statTimesteps.textContent = msg.total_timesteps.toLocaleString();

      if (msg.scored) {
        goalFlash.classList.add("show");
        setTimeout(() => goalFlash.classList.remove("show"), 700);
      }
    };

    socket.onclose = () => {
      setStatus(false);
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.5, MAX_RECONNECT_DELAY);
    };

    socket.onerror = () => socket.close();
  }

  // Keep the socket alive through proxies/tunnels (e.g. ngrok) that drop idle connections.
  setInterval(() => {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send("ping");
  }, 20000);

  connect();
})();
</script>
</body>
</html>
